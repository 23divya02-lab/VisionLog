<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{student.name}} - Chart</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="{{url_for('static',filename='css/style.css')}}">
    <link rel="stylesheet" href="{{url_for('static',filename='css/dark-mode.css')}}" id="dark-mode-css" disabled>
    <style>.chart-card{background:white;padding:20px;border-radius:15px;margin:15px 0;box-shadow:0 5px 15px rgba(0,0,0,0.05);}.chart-card h3{color:#4c1d95;}.chart-container{position:relative;height:280px;}.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:15px 0;}.stat-card{background:white;padding:12px;border-radius:12px;text-align:center;}.stat-card h3{font-size:22px;margin:0;}.stat-card p{margin:3px 0 0;font-size:11px;color:#6b7280;}</style>
</head>
<body>
    <a href="javascript:void(0)" onclick="toggleDarkMode()" id="darkToggle" style="position:fixed;top:20px;right:20px;z-index:99999;background:#a78bfa;color:white;padding:10px 18px;border-radius:50px;font-size:14px;cursor:pointer;box-shadow:0 5px 20px rgba(0,0,0,0.3);text-decoration:none;font-weight:600;">🌙 Dark</a>
    <div class="container" style="max-width:700px;">
        <img src="{{url_for('static',filename='images/logo.png')}}" alt="VisionLog" style="max-width:80px;border-radius:10px;margin-bottom:5px;display:block;margin-left:auto;margin-right:auto;">
        <h1>📊 {{student.name}}'s Attendance</h1>
        <p style="color:#6b7280;">Reg No: <strong>{{student.reg_no}}</strong> | Course: <strong>{{student.course}}</strong></p>
        <div class="stats-grid"><div class="stat-card"><h3 style="color:#065f46;">{{stats.present}}</h3><p>✅ Present</p></div><div class="stat-card"><h3 style="color:#991b1b;">{{stats.total_working-stats.present}}</h3><p>❌ Absent</p></div><div class="stat-card"><h3 style="color:#4c1d95;">{{stats.total_working}}</h3><p>📅 Total</p></div><div class="stat-card"><h3 style="color:#a78bfa;">{{stats.percentage}}%</h3><p>📈 Percent</p></div></div>
        <div class="chart-card"><h3>🍩 Present vs Absent</h3><div class="chart-container"><canvas id="pieChart"></canvas></div></div>
        <div class="chart-card"><h3>📅 Last 7 Days</h3><div class="chart-container"><canvas id="dailyChart"></canvas></div></div>
        <a href="{{url_for('admin_dashboard')}}" class="btn">← Back</a>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script>
        new Chart(document.getElementById('pieChart'),{type:'doughnut',data:{labels:['Present','Absent'],datasets:[{data:[{{stats.present}},{{stats.total_working-stats.present}}],backgroundColor:['#10b981','#ef4444']}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}}}});
        new Chart(document.getElementById('dailyChart'),{type:'bar',data:{labels:{{daily_labels|tojson}},datasets:[{label:'Present',data:{{daily_present|tojson}},backgroundColor:'#10b981'},{label:'Absent',data:{{daily_absent|tojson}},backgroundColor:'#ef4444'}]},options:{responsive:true,maintainAspectRatio:false,scales:{x:{stacked:true},y:{stacked:true,beginAtZero:true,max:1}},plugins:{legend:{position:'bottom'}}}});
        var dCSS=document.getElementById('dark-mode-css'),dTog=document.getElementById('darkToggle');
        function ut(){if(document.body.classList.contains('dark-mode')){dTog.textContent='☀️ Light';dTog.style.background='#fbbf24';dTog.style.color='#000';}else{dTog.textContent='🌙 Dark';dTog.style.background='#a78bfa';dTog.style.color='#fff';}}
        if(localStorage.getItem('darkMode')==='enabled'){if(dCSS)dCSS.disabled=false;document.body.classList.add('dark-mode');}ut();
        function toggleDarkMode(){if(document.body.classList.contains('dark-mode')){document.body.classList.remove('dark-mode');if(dCSS)dCSS.disabled=true;localStorage.setItem('darkMode','disabled');}else{document.body.classList.add('dark-mode');if(dCSS)dCSS.disabled=false;localStorage.setItem('darkMode','enabled');}ut();}
    </script>
</body>
</html>
