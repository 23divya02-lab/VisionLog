<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mark Attendance - VisionLog</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="{{url_for('static',filename='css/style.css')}}">
    <link rel="stylesheet" href="{{url_for('static',filename='css/dark-mode.css')}}" id="dark-mode-css" disabled>
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <style>#video{width:100%;max-width:400px;border-radius:15px;}.status{padding:12px;border-radius:12px;margin:12px 0;}.success{background:#d1fae5;color:#065f46;}.error{background:#fee2e2;color:#991b1b;}.info{background:#e0e7ff;color:#3730a3;}.status-toggle{display:flex;gap:15px;justify-content:center;margin:12px 0;}.status-toggle label{cursor:pointer;padding:8px 16px;border-radius:50px;font-weight:600;font-size:14px;}.status-present{background:#d1fae5;color:#065f46;}.status-absent{background:#fee2e2;color:#991b1b;}.liveness-box{background:#fef3c7;padding:12px;border-radius:12px;margin:12px 0;text-align:center;}</style>
</head>
<body>
    <a href="javascript:void(0)" onclick="toggleDarkMode()" id="darkToggle" style="position:fixed;top:20px;right:20px;z-index:99999;background:#a78bfa;color:white;padding:10px 18px;border-radius:50px;font-size:14px;cursor:pointer;box-shadow:0 5px 20px rgba(0,0,0,0.3);text-decoration:none;font-weight:600;">🌙 Dark</a>
    <div class="container">
        <img src="{{url_for('static',filename='images/logo.png')}}" alt="VisionLog" style="max-width:80px;border-radius:10px;margin-bottom:5px;display:block;margin-left:auto;margin-right:auto;">
        <h1>✅ Mark Attendance</h1>
        <div class="status-toggle"><label class="status-present"><input type="radio" name="attendance_status" value="Present" checked> ✅ Present</label><label class="status-absent"><input type="radio" name="attendance_status" value="Absent"> ❌ Absent</label></div>
        <div class="liveness-box"><h4 style="color:#4c1d95;">👁️ Blink Verification</h4><p id="blinkInstruction">Blink <strong>1 time</strong> naturally</p><p style="font-size:18px;font-weight:700;color:#a78bfa;" id="blinkCounter">0/1</p></div>
        <video id="video" autoplay playsinline></video>
        <div id="status" class="status info">Loading...</div>
        <button class="btn" id="markBtn" disabled>📸 Mark Attendance</button>
        <p id="locationStatus">📍 Getting location...</p>
        <a href="{{url_for('student_dashboard')}}">← Back</a>
    </div>
    <script>
        const MU='https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model';let cl=null,vs=null,bv=false,bc=0,bCl=false;
        const v=document.getElementById('video'),s=document.getElementById('status'),mb=document.getElementById('markBtn'),bk=document.getElementById('blinkCounter'),bi=document.getElementById('blinkInstruction');
        function ss(m,t='info'){s.textContent=m;s.className=`status ${t}`;}
        function ear(e){const a=Math.hypot(e[1].x-e[5].x,e[1].y-e[5].y),b=Math.hypot(e[2].x-e[4].x,e[2].y-e[4].y),c=Math.hypot(e[0].x-e[3].x,e[0].y-e[3].y);return(a+b)/(2*c);}
        if(navigator.geolocation){navigator.geolocation.getCurrentPosition(p=>{cl={lat:p.coords.latitude,lon:p.coords.longitude};document.getElementById('locationStatus').textContent='📍 Location captured';},()=>{document.getElementById('locationStatus').textContent='⚠️ No location';});}
        async function lm(){try{ss('Loading...','info');await faceapi.nets.tinyFaceDetector.loadFromUri(MU);await faceapi.nets.faceLandmark68Net.loadFromUri(MU);await faceapi.nets.faceRecognitionNet.loadFromUri(MU);return true;}catch(e){ss('Error','error');return false;}}
        async function sv(){try{const st=await navigator.mediaDevices.getUserMedia({video:{width:640,height:480}});v.srcObject=st;vs=st;ss('Blink naturally.','success');db();}catch(e){ss('Camera error','error');}}
        async function db(){setInterval(async()=>{if(bv)return;const d=await faceapi.detectSingleFace(v,new faceapi.TinyFaceDetectorOptions({inputSize:320,scoreThreshold:0.5})).withFaceLandmarks();if(!d||!d.landmarks)return;const e=(ear(d.landmarks.getLeftEye())+ear(d.landmarks.getRightEye()))/2;if(e<0.28&&!bCl){bCl=true;}else if(e>0.32&&bCl){bCl=false;bc++;bk.textContent=`${bc}/1`;if(bc>=1){bv=true;bi.textContent='✅ Verified!';bi.style.color='#10b981';mb.disabled=false;ss('✅ Click button','success');}}},200);}
        window.addEventListener('load',async()=>{if(await lm())await sv();});
        mb.addEventListener('click',async()=>{ss('Detecting...','info');mb.disabled=true;const d=await faceapi.detectSingleFace(v,new faceapi.TinyFaceDetectorOptions({inputSize:320,scoreThreshold:0.5})).withFaceLandmarks().withFaceDescriptor();if(!d){ss('No face','error');mb.disabled=false;return;}const r=await fetch('/student/process-attendance',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({descriptor:Array.from(d.descriptor),latitude:cl?.lat,longitude:cl?.lon,status:document.querySelector('input[name="attendance_status"]:checked').value})});const j=await r.json();if(j.success){ss('✅ '+j.message,'success');}else{ss('❌ '+j.message,'error');}mb.disabled=false;});
        var dCSS=document.getElementById('dark-mode-css'),dTog=document.getElementById('darkToggle');
        function ut(){if(document.body.classList.contains('dark-mode')){dTog.textContent='☀️ Light';dTog.style.background='#fbbf24';dTog.style.color='#000';}else{dTog.textContent='🌙 Dark';dTog.style.background='#a78bfa';dTog.style.color='#fff';}}
        if(localStorage.getItem('darkMode')==='enabled'){if(dCSS)dCSS.disabled=false;document.body.classList.add('dark-mode');}ut();
        function toggleDarkMode(){if(document.body.classList.contains('dark-mode')){document.body.classList.remove('dark-mode');if(dCSS)dCSS.disabled=true;localStorage.setItem('darkMode','disabled');}else{document.body.classList.add('dark-mode');if(dCSS)dCSS.disabled=false;localStorage.setItem('darkMode','enabled');}ut();}
    </script>
    <script>
    // Toast Notifications
    function showToast(message, type) {
        var container = document.querySelector('.toast-container');
        if (!container) {
            container = document.createElement('div');
            container.className = 'toast-container';
            document.body.appendChild(container);
        }
        var toast = document.createElement('div');
        toast.className = 'toast toast-' + type;
        toast.textContent = message;
        container.appendChild(toast);
        setTimeout(function() { toast.remove(); }, 3500);
    }
    
    // Auto-convert flash messages to toasts
    document.addEventListener('DOMContentLoaded', function() {
        var flashes = document.querySelectorAll('.flash-success, .flash-error, .flash-info');
        flashes.forEach(function(flash) {
            var type = 'info';
            if (flash.classList.contains('flash-success')) type = 'success';
            if (flash.classList.contains('flash-error')) type = 'error';
            showToast(flash.textContent.trim(), type);
            flash.style.display = 'none';
        });
    });
</script>
    
    
</body>
</html>
