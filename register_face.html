<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Face - VisionLog</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="{{url_for('static',filename='css/style.css')}}">
    <link rel="stylesheet" href="{{url_for('static',filename='css/dark-mode.css')}}" id="dark-mode-css" disabled>
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <style>#video{width:100%;max-width:400px;border-radius:15px;margin:15px auto;display:block;background:#1f2937;}.status{padding:8px;border-radius:8px;margin:8px 0;}.info{background:#e0e7ff;color:#3730a3;}.success{background:#d1fae5;color:#065f46;}.error{background:#fee2e2;color:#991b1b;}.liveness-box{background:#fef3c7;padding:12px;border-radius:12px;margin:12px 0;text-align:center;}</style>
</head>
<body>
    <a href="javascript:void(0)" onclick="toggleDarkMode()" id="darkToggle" style="position:fixed;top:20px;right:20px;z-index:99999;background:#a78bfa;color:white;padding:10px 18px;border-radius:50px;font-size:14px;cursor:pointer;box-shadow:0 5px 20px rgba(0,0,0,0.3);text-decoration:none;font-weight:600;">🌙 Dark</a>
    <div class="container">
        <img src="{{url_for('static',filename='images/logo.png')}}" alt="VisionLog" style="max-width:80px;border-radius:10px;margin-bottom:5px;display:block;margin-left:auto;margin-right:auto;">
        <h1>📸 Register Face</h1>
        <p>Look at camera. Blink naturally.</p>
        <video id="video" autoplay playsinline></video>
        <div class="liveness-box"><h4 style="color:#4c1d95;">👁️ Blink Verification</h4><p id="blinkInstruction">Blink <strong>2 times</strong> naturally</p><p style="font-size:22px;font-weight:700;color:#a78bfa;" id="blinkCounter">0/2</p></div>
        <div id="status" class="status info">Loading...</div>
        <button class="btn" id="captureBtn" disabled>📷 Capture Face</button>
        <button class="btn" id="submitBtn" style="display:none;">✅ Submit</button>
        <button class="btn" id="retryBtn" style="display:none;">🔄 Retry</button>
        <form id="faceForm" method="POST" style="display:none;"><input type="hidden" name="descriptor" id="descriptorInput"></form>
        <br><a href="{{url_for('student_dashboard')}}">← Back</a>
    </div>
    <script>
        const MU='https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model';let fd=null,vs=null,bc=0,bv=false,bCl=false;
        const v=document.getElementById('video'),s=document.getElementById('status'),cb=document.getElementById('captureBtn'),sb=document.getElementById('submitBtn'),rb=document.getElementById('retryBtn'),bk=document.getElementById('blinkCounter'),bi=document.getElementById('blinkInstruction');
        function ss(m,t='info'){s.textContent=m;s.className=`status ${t}`;}
        function ear(e){const a=Math.hypot(e[1].x-e[5].x,e[1].y-e[5].y),b=Math.hypot(e[2].x-e[4].x,e[2].y-e[4].y),c=Math.hypot(e[0].x-e[3].x,e[0].y-e[3].y);return(a+b)/(2*c);}
        async function lm(){try{ss('Loading...','info');await faceapi.nets.tinyFaceDetector.loadFromUri(MU);await faceapi.nets.faceLandmark68Net.loadFromUri(MU);await faceapi.nets.faceRecognitionNet.loadFromUri(MU);return true;}catch(e){ss('Error','error');return false;}}
        async function sv(){try{const st=await navigator.mediaDevices.getUserMedia({video:{width:640,height:480}});v.srcObject=st;vs=st;ss('Blink naturally 2 times.','success');db();}catch(e){ss('Camera error','error');}}
        async function db(){setInterval(async()=>{if(bv)return;const d=await faceapi.detectSingleFace(v,new faceapi.TinyFaceDetectorOptions({inputSize:320,scoreThreshold:0.5})).withFaceLandmarks();if(!d||!d.landmarks)return;const e=(ear(d.landmarks.getLeftEye())+ear(d.landmarks.getRightEye()))/2;if(e<0.28&&!bCl){bCl=true;}else if(e>0.32&&bCl){bCl=false;bc++;bk.textContent=`${bc}/2`;if(bc>=2){bv=true;bi.textContent='✅ Verified!';bi.style.color='#10b981';cb.disabled=false;ss('✅ Click Capture','success');}}},200);}
        window.addEventListener('load',async()=>{if(await lm())await sv();});
        cb.addEventListener('click',async()=>{ss('Detecting...','info');cb.disabled=true;const d=await faceapi.detectSingleFace(v,new faceapi.TinyFaceDetectorOptions({inputSize:320,scoreThreshold:0.5})).withFaceLandmarks().withFaceDescriptor();if(!d){ss('No face','error');cb.disabled=false;return;}fd=Array.from(d.descriptor);ss('Captured!','success');cb.style.display='none';sb.style.display='inline-block';rb.style.display='inline-block';});
        rb.addEventListener('click',()=>{fd=null;cb.style.display='inline-block';cb.disabled=false;sb.style.display='none';rb.style.display='none';});
        sb.addEventListener('click',()=>{if(fd&&fd.length===128){document.getElementById('descriptorInput').value=JSON.stringify(fd);document.getElementById('faceForm').submit();}});
        var dCSS=document.getElementById('dark-mode-css'),dTog=document.getElementById('darkToggle');
        function ut(){if(document.body.classList.contains('dark-mode')){dTog.textContent='☀️ Light';dTog.style.background='#fbbf24';dTog.style.color='#000';}else{dTog.textContent='🌙 Dark';dTog.style.background='#a78bfa';dTog.style.color='#fff';}}
        if(localStorage.getItem('darkMode')==='enabled'){if(dCSS)dCSS.disabled=false;document.body.classList.add('dark-mode');}ut();
        function toggleDarkMode(){if(document.body.classList.contains('dark-mode')){document.body.classList.remove('dark-mode');if(dCSS)dCSS.disabled=true;localStorage.setItem('darkMode','disabled');}else{document.body.classList.add('dark-mode');if(dCSS)dCSS.disabled=false;localStorage.setItem('darkMode','enabled');}ut();}
    </script>
    <script>
    // Toast Notifications
    function showToast(message, type) {
        var container = document.querySelector('.toast-container');
        if (!container) {
            container = document.createElement('div');
            container.className = 'toast-container';
            document.body.appendChild(container);
        }
        var toast = document.createElement('div');
        toast.className = 'toast toast-' + type;
        toast.textContent = message;
        container.appendChild(toast);
        setTimeout(function() { toast.remove(); }, 3500);
    }
    
    // Auto-convert flash messages to toasts
    document.addEventListener('DOMContentLoaded', function() {
        var flashes = document.querySelectorAll('.flash-success, .flash-error, .flash-info');
        flashes.forEach(function(flash) {
            var type = 'info';
            if (flash.classList.contains('flash-success')) type = 'success';
            if (flash.classList.contains('flash-error')) type = 'error';
            showToast(flash.textContent.trim(), type);
            flash.style.display = 'none';
        });
    });
</script>
</body>
</html>
